<!doctype html>
<html lang="en" data-theme="cherry">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0406">
<script>try{var t=localStorage.getItem("minrae-v5-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/minrae.css">
<title>Collection - MINRAE</title>
</head>
<body data-page="collection">
<div id="site-header"></div>
<main class="section">
  <div class="toolbar">
    <div class="chips" role="group" aria-label="Filter by platform">
      <button class="chip is-active" data-filter="all">All</button>
      <button class="chip" data-filter="PC">PC</button>
      <button class="chip" data-filter="PC + Quest">PC + Quest</button>
    </div>
    <div style="display:flex;gap:16px;align-items:center">
      <span class="count" id="count"></span>
      <select class="select" id="sort" aria-label="Sort">
        <option value="new">Newest</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
      </select>
    </div>
  </div>
  <div class="grid" id="collection-grid"></div>
</main>
<div id="site-footer"></div>
<script src="assets/minrae.js"></script>
</body>
</html>
