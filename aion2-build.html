<script>try{var t=localStorage.getItem('aion2_build_theme');if(t==='light')t='mist';if(t==='dark')t='aion';if(!t){var b=JSON.parse(localStorage.getItem('aion2_state')||'null');t=b&&b.settings&&b.settings.theme;}if(['aion','paper','lamp','slate','mist','pixel'].indexOf(t)<0)t='aion';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
/* Themes: the same six as the Daily Board (aion2.html). --line is the quiet border, --line2 the accent border. */
:root,html[data-theme="aion"]{
  --bg:#0a0e17; --panel:#0f1522; --panel2:#161d2e; --panel3:#1d2538; --line:rgba(255,255,255,.08); --line2:rgba(205,176,112,.34);
  --text:#e6e2d6; --muted:#9ba5b9; --gold:#cdb070; --blue:#8dc3e8; --good:#8fcfb0; --warn:#e5b567; --bad:#e08a8a; --on:#0a0e17;
  --hfont:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif; --font:"Segoe UI",system-ui,-apple-system,sans-serif;
  --bgimg:radial-gradient(1100px 380px at 50% -12%,rgba(141,195,232,.07),transparent 70%); color-scheme:dark;
}
html[data-theme="paper"]{
  --bg:#e8dcc0; --panel:#faf4e4; --panel2:#f0e6cc; --panel3:#e6d9b8; --line:rgba(90,70,40,.22); --line2:rgba(110,75,30,.45);
  --text:#2f2519; --muted:#5e5038; --gold:#8c3a2b; --blue:#3f5b7a; --good:#3b5833; --warn:#7a5210; --bad:#8c3a2b; --on:#faf4e4;
  --hfont:Georgia,"Iowan Old Style",Palatino,serif; --font:Georgia,"Iowan Old Style",Palatino,serif;
  --bgimg:radial-gradient(ellipse at top left,rgba(255,255,255,.25),transparent 60%); color-scheme:light;
}
html[data-theme="lamp"]{
  --bg:#1c1712; --panel:#2a231b; --panel2:#33291f; --panel3:#3d3126; --line:rgba(255,255,255,.08); --line2:rgba(217,173,98,.32);
  --text:#efe3cc; --muted:#bba98d; --gold:#d9ad62; --blue:#e0916f; --good:#7fae72; --warn:#d9ad62; --bad:#e08268; --on:#1c1712;
  --hfont:Georgia,"Iowan Old Style",Palatino,serif; --font:Georgia,"Iowan Old Style",Palatino,serif; --bgimg:none; color-scheme:dark;
}
html[data-theme="slate"]{
  --bg:#13151c; --panel:#1a1d26; --panel2:#222633; --panel3:#2a2f3e; --line:rgba(255,255,255,.07); --line2:rgba(143,160,217,.30);
  --text:#e0e3ee; --muted:#9ca2b6; --gold:#8fa0d9; --blue:#8fa0d9; --good:#7fb59a; --warn:#d4b483; --bad:#c98a8a; --on:#13151c;
  --hfont:system-ui,"Segoe UI",sans-serif; --font:system-ui,"Segoe UI",sans-serif; --bgimg:none; color-scheme:dark;
}
html[data-theme="mist"]{
  --bg:#eceef2; --panel:#fbfbfd; --panel2:#e6e9ef; --panel3:#dde1e9; --line:rgba(0,0,0,.12); --line2:rgba(59,85,160,.40);
  --text:#1d212b; --muted:#555b6e; --gold:#3b55a0; --blue:#3b55a0; --good:#2f6f50; --warn:#7d5f28; --bad:#8c4545; --on:#fbfbfd;
  --hfont:system-ui,"Segoe UI",sans-serif; --font:system-ui,"Segoe UI",sans-serif; --bgimg:none; color-scheme:light;
}
html[data-theme="pixel"]{
  --bg:#0b0a1e; --panel:#15122e; --panel2:#201b4a; --panel3:#2a2460; --line:#2f2a74; --line2:#7a68e8;
  --text:#f2edff; --muted:#aaa2dc; --gold:#ffd24f; --blue:#4fe6ff; --good:#5bff9a; --warn:#ffb23f; --bad:#ff6b8b; --on:#0b0a1e;
  --hfont:ui-monospace,"SF Mono",Menlo,Consolas,monospace; --font:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bgimg:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 4px,transparent 4px 8px),repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 4px,transparent 4px 8px); color-scheme:dark;
}
html[data-theme="pixel"] *{border-radius:0!important}
html[data-theme="pixel"] body{background-repeat:repeat}
html[data-theme="pixel"] .card{border:3px solid var(--line2);box-shadow:5px 5px 0 #000}
html[data-theme="pixel"] h1,html[data-theme="pixel"] .brand .t{text-transform:uppercase;letter-spacing:.06em;text-shadow:3px 3px 0 #6b2bd2}
html[data-theme="pixel"] h2{text-transform:uppercase;letter-spacing:.08em}
html[data-theme="pixel"] button{border:2px solid var(--line2);box-shadow:3px 3px 0 #000}
html[data-theme="pixel"] button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
html[data-theme="pixel"] .top{border-bottom:4px solid var(--line2)}
html[data-theme="pixel"] dialog{border:4px solid var(--line2);box-shadow:8px 8px 0 #000}
*{box-sizing:border-box}
html,body{margin:0;background-color:var(--bg);background-image:var(--bgimg);background-repeat:no-repeat;background-attachment:fixed;color:var(--text);font:14px/1.5 var(--font)}
a{color:var(--gold);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--line2)}
button.pri{background:var(--gold);color:var(--on);border-color:var(--gold);font-weight:600}
button.ghost{background:transparent}
button.sm{padding:3px 8px;font-size:12px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;max-width:100%}
input:not([type=checkbox]):not([type=radio]):not([type=file]){width:100%}
td input:not([type=checkbox]){min-width:60px}
.row>input,.row>select,.row>textarea{width:auto;flex:1 1 140px}
.top .pick select{width:auto;max-width:170px}
input[type=file]{max-width:100%}
.tfilter select{flex:0 0 auto;width:auto}
main:focus{outline:none}
.tier{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tier:last-child{border-bottom:0}
.tier .tl{font-size:22px;font-weight:700;color:var(--gold);text-align:center;border:1px solid var(--line2);border-radius:8px;display:flex;align-items:center;justify-content:center;min-height:48px}
.tier.t2 .tl{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 45%,transparent)}
.tier.t3 .tl{color:var(--muted);border-color:var(--line)}
.scard{display:inline-flex;flex-direction:column;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:0 6px 6px 0;min-width:150px;vertical-align:top}
.scard b{font-size:13px}
.scard span{font-size:12px;color:var(--muted)}
.tour-hl{position:relative;z-index:61;box-shadow:0 0 0 3px var(--gold),0 0 0 9999px rgba(0,0,0,.62)!important;border-radius:8px;background:var(--panel)}
.tour-pop{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
textarea{width:100%;min-height:80px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 3px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.muted{color:var(--muted)} .gold{color:var(--gold)} .good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)} .blue{color:var(--blue)}
.small{font-size:12px} .right{text-align:right} .nowrap{white-space:nowrap}
.hidden{display:none!important}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px}
.brand .t{font-family:var(--hfont);font-size:20px;color:var(--gold);line-height:1}
.brand .s{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.top .sp{flex:1}
.top .pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .pick label{margin:0}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 56px)}
.side{border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:56px;align-self:start;height:calc(100vh - 56px);overflow:auto}
.side a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;color:var(--muted)}
.side a:hover{background:var(--panel);color:var(--text);text-decoration:none}
.side a.cur{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--gold)}
.side svg{width:16px;height:16px;flex:none}
.side .sec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 10px 6px}
main{padding:20px 24px 60px;min-width:0}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
  .side .sec{display:none}
  .side a{flex:none;padding:6px 10px}
  main{padding:16px 14px 60px}
  .top{flex-wrap:wrap}
}
h1{font-family:var(--hfont);font-weight:400;font-size:26px;margin:0 0 4px;color:var(--text)}
h2{font-size:15px;font-weight:600;margin:0 0 10px;color:var(--gold);letter-spacing:.02em}
h3{font-size:13px;font-weight:600;margin:14px 0 6px;color:var(--text)}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head .sp{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card.hl{border-color:var(--line2)}
.kpi .l{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;line-height:1.6}
.pill.verified{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.pill.confirmed{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 45%,transparent)}
.pill.imported{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.pill.estimated{color:var(--warn)}
.pill.outdated,.pill.unknown{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.pill.t-Sp,.pill.t-S{color:var(--gold);border-color:var(--line2)} .pill.t-Ap,.pill.t-A{color:var(--blue)}
.lvl-High{color:var(--good)} .lvl-Medium{color:var(--warn)} .lvl-Low{color:var(--muted)} .lvl-Unknown{color:var(--muted);font-style:italic}
.bar{height:6px;background:var(--panel3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.bar.blue i{background:var(--blue)}
.eq{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-align:left;width:100%}
.slot:hover{border-color:var(--line2)}
.slot .sn{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.slot .in{font-weight:600;margin-top:2px}
.slot .en{color:var(--gold)}
.note{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);padding:8px 12px;border-radius:0 6px 6px 0;margin:0 0 12px}
.note.info{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent)}
.note.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.form input,.form select{width:100%}
.form>div{min-width:0}
.list{list-style:none;padding:0;margin:0}
.list li{padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.rec .t{font-weight:600}
.rec .m{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);padding:8px 12px}
.tabs button.cur{color:var(--text);border-bottom-color:var(--gold)}
.review{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px}
@media(max-width:900px){.review{grid-template-columns:1fr}}
.review img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto;padding:4px}
.msg{padding:9px 12px;border-radius:10px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--panel3)}
.msg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.msg.t{align-self:flex-start;font-size:12px;color:var(--muted);background:transparent;padding:2px 12px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:12px;padding:0;width:min(760px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog .dh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
dialog .dh h2{margin:0;flex:1}
dialog .db{padding:14px 16px;overflow:auto;max-height:calc(90vh - 120px)}
dialog .df{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.toast{position:fixed;right:16px;bottom:16px;z-index:50;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:10px 14px;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
svg.chart{width:100%;height:180px;display:block}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--panel3);font-size:12px;margin:2px 4px 2px 0}
.ok-row td{background:color-mix(in srgb,var(--good) 7%,transparent)}
.bad-row td{background:color-mix(in srgb,var(--bad) 7%,transparent)}
.conf-row td{background:color-mix(in srgb,var(--warn) 9%,transparent)}

#ari{position:fixed;right:16px;bottom:16px;z-index:65;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ari-btn{width:58px;height:58px;border-radius:50%!important;padding:4px;background:var(--panel);border:1px solid var(--line2);box-shadow:0 6px 18px rgba(0,0,0,.35);animation:ariBob 3.2s ease-in-out infinite}
.ari-btn svg{width:100%;height:100%;display:block}
.ari-btn:hover{border-color:var(--gold)}
@keyframes ariBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.ari-btn{animation:none}}
.ari-panel{width:min(340px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.ari-panel #ariQ{margin:10px 0 6px}
.ari-say{line-height:1.45}
.ari-item{display:block;width:100%;text-align:left;margin:4px 0;background:var(--panel2)}
.ari-bubble{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:8px 12px;font-size:13px;max-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast{right:90px}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/dashboard" aria-label="Build Architect home">
    <svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true"><path d="M24 2 L46 24 L24 46 L2 24 Z" fill="none" stroke="var(--gold)" stroke-width="2"/><path d="M24 12 L36 24 L24 36 L12 24 Z" fill="var(--gold)" opacity=".25"/></svg>
    <div><div class="t">Build Architect</div><div class="s">AION 2 &middot; Character planner</div></div>
  </a>
  <span class="sp"></span>
  <div class="pick">
    <label for="pickPlayer">Character</label><select id="pickPlayer"></select>
    <select id="themePick" aria-label="Theme"></select>
    <a href="aion2.html">Daily board</a>
    <button class="sm" id="helpBtn" type="button" data-act="help-menu">Help</button>
  </div>
</header>
<div class="layout">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="view" tabindex="-1"></main>
</div>

<div class="toast hidden" id="toast" role="status"></div>
<noscript><p style="padding:20px">The Build Architect needs JavaScript.</p></noscript>
<script src="aion2-build/core.js"></script>
<script src="aion2-build/app.js"></script>
<script src="aion2-build/views-a.js"></script>
<script src="aion2-build/views-b.js"></script>
<script src="aion2-build/views-chars.js"></script>
<script src="aion2-build/views-guide.js"></script>
</body>
</html>
